# OneiOS build profile: iOS 16.5 (20F66), the iPhone X restore file (iPhone10,3 and iPhone10,6, D22AP, T8015), for
# the Galaxy A56 (SM-A566, a56x, Exynos 1580): docs/a56.md.
#
# The image set is iOS 16.5's own, all of it from this one restore file: the OS, SystemOS and AppOS images, their
# trust caches and root hashes, and the Data seed made from this OS image's /private/var. Nothing of 24A446 is in it.
# The kernel collection beside it (kernel.kc) is the exception: OneiOS's hosted XNU prelinked with the iPhone18,2
# 24A446 kexts, the only collection there is (the 16.5 userland on it is the other A56 fork's result, docs/a56.md).
# So Make iOS image needs the 24A446 kernelcache as well (the app's Update the kernel, kb/kernelcache.macho): this
# profile has no kernelcache member.
#
# Every pin below was read on 2026-11-23 from Apple's own data:
#   - the IPSW's URL, size and SHA-256: https://api.ipsw.me/v4/ipsw/iPhone10,3/20F66 (the same file for iPhone10,6)
#   - member names, sizes and CRC-32: the IPSW's ZIP directory (its last 2 MiB, by a range request)
#   - component -> member, and sha384: BuildManifest.plist, identity "Customer Erase Install (IPSW)" of d22ap.
#     For a member that is not AEA, the BuildManifest digest is the SHA-384 of the file as shipped.
#   - plain_sha256 of the OS image: the raw APFS image `oneios-tool image udif-raw` made of the fetched member
#     (the member is a UDIF disk image: a GPT disk with one Apple_APFS partition, LZFSE chunks; docs/image-format.md).
# The reference-only version of this file (port-a56, 2026-11-21: the A56's hardware facts, now in docs/a56.md, and
# the launchd jobs the other fork disabled) had another URL, which Apple's server answers with 403, and another
# sha256; its size and build were right.
# Format of this file: docs/image-format.md, "Profile".
schema = 1

[os]
name = "ios-16.5-20F66-iPhone10,3"
version = "16.5"
build = "20F66"
device = "iPhone10,3"
board = "d22ap"
platform = "t8015"
chip_id = 0x8015
board_id = 0x06
arch = "arm64"

[ipsw]
url = "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
size = 6165698198
# of the whole file (ipsw.me). The fetch never has the whole file, so it cannot check this one; it checks the members.
sha256 = "c1091c401f67e3aa7cdfeb2cc19e6c79be3c957aae4e097a019e9ccea07d52f2"
metadata = "https://api.ipsw.me/v4/ipsw/iPhone10,3/20F66"
variant = "Customer Erase Install (IPSW)"
# free space the fetch wants in inputs/: the members (7.0 GiB) and the OS image's raw APFS image beside its UDIF file
need_gib = 20

