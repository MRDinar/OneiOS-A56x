# --- the image set (out/image/20F66/) ----------------------------------------------------------------------

[image]
format = 1
id = "ios-16.5-20F66-iPhone10-3"
# where the OneOS fork unpacks the set on the phone (oneos/interface.md, section 3)
stage = "/data/local/tmp/oneios/image"
archive = "OneiOS_iOS16.5_20F66_iPhone10-3.tar.zst"
# bytes per entry of an image's hash list (NAME.hashes)
chunk = 1048576
seed = "data.seed"
# the kernel collection: OneiOS's hosted XNU prelinked with the 24A446 kexts (kernel/prelink/README.md)
kernel = "kernel.kc"

[image.files]
os = "os.img"
systemos = "systemos.img"
app = "app.img"
trust-static = "trust/static.trustcache"
trust-system = "trust/system.trustcache"
trust-app = "trust/app.trustcache"
roothash-os = "trust/os.root_hash"
roothash-system = "trust/system.root_hash"
roothash-app = "trust/app.root_hash"

[data]
# The Data volume the guest makes from the seed on its first start (the same UUID as the 24A446 set's)
volume_uuid = "1B7DB2B7-5ECA-4FDA-98AF-55DF8632E355"
volume_name = "Data"
store_gib = 16
source = "private/var"
# time of every seed file the build adds or rewrites: the restore file's release (2023-05-18T18:14:18Z, ipsw.me)
epoch = 1684433658
