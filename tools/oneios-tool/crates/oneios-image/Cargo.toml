[package]
name = "oneios-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
memmap2.workspace = true
rayon.workspace = true
# asm: sha2 0.10 uses the ARMv8 SHA-256 instructions on aarch64 only with this feature (without it: the plain
# software rounds, about 8 times slower on an M4). The image tool hashes 16 GiB per build.
sha2 = { workspace = true, features = ["asm"] }
libc.workspace = true
oneios-common.workspace = true
# `image im4p`: the DER container and the LZFSE payload (imagetool.py starts the `lzfse` program for it).
simple_asn1 = "0.6"
lzfse_rust = "0.2"
# decmpfs: the zlib kinds of files kept compressed in an APFS volume (apfs/decmpfs.rs).
flate2 = "1"
# The profile (profiles/*.toml), as Python's tomllib reads it: preserve_order keeps the tables' key order, which
# `image profile PROFILE` prints.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
tar = { version = "0.4", default-features = false }
base64 = "0.22"
percent-encoding = "2"
zbitmap = "0.1"
# remotezip, transfer: HTTP range requests (ureq: its resolver hook carries the short try per address; rustls, no
# OpenSSL), inflate is flate2 above, the members' CRC-32; `ls`'s pattern. transfer's state file is a JSON line.
ureq = "2"
serde_json.workspace = true
crc32fast = "1"
regex = "1"
# check-ipsw, fetch: the BuildManifest.
plist = { version = "1", default-features = false }
# image aea-decrypt (aea_decrypt.rs): the AEA profile of the IPSW's images. HKDF-SHA256, HMAC-SHA256 and AES-256-CTR
# for the archive (on sha2 0.10 above: its asm); the archive key comes out of Apple's key service's answer by HPKE
# (RFC 9180: DHKEM(P-256, HKDF-SHA256), HKDF-SHA256, AES-256-GCM) with the P-256 key in PKCS#8 PEM that the
# archive's key URL serves.
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
hpke = { version = "0.12", default-features = false, features = ["alloc", "p256"] }
p256 = { version = "0.13", default-features = false, features = ["pkcs8", "pem", "std"] }
