[package]
name = "oneios-display"
description = "The display helper: SurfaceControl on Android, the xhd protocol shared with xnuhost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# The phone's four files (build-android.sh): bin/oneios-display and bin/displayctl static, bin/liboneios-display.so
# the lib built as a cdylib with the feature `jni` (cargo rustc --crate-type cdylib), lib/oneios-display.dex by d8.
[lib]
path = "src/lib.rs"

[features]
# liboneios-display.so's exports (src/jni.rs, Android only): links libandroid and libnativewindow, so only the
# cdylib build turns it on (xnuhost links this crate statically and must not need them).
jni = []

[[bin]]
name = "oneios-display"
path = "src/bin/launcher.rs"

[[bin]]
name = "displayctl"
path = "src/bin/displayctl.rs"

# tests/test_display.c's displayctl part: the test binary is also the stand-in helper displayctl starts.
[[test]]
name = "displayctl"
path = "tests/displayctl.rs"
harness = false

# The Makefile's TestModes on the host's JVM (javac and java; skipped without them).
[[test]]
name = "java_modes"
path = "tests/java_modes.rs"

[dependencies]
libc.workspace = true
xh-core.workspace = true

[lints]
workspace = true
